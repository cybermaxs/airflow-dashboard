name: airflow_dashboard
version: "1.0.0"
profile: airflow_dashboard

model-paths: ["models"]
seed-paths: ["seeds"]

vars:
  # how far back incremental models re-read Postgres, to catch late updates (running -> success, retries)
  lookback_days: 3

models:
  airflow_dashboard:
    staging:
      +schema: staging
    marts:
      +schema: marts
      +materialized: table
